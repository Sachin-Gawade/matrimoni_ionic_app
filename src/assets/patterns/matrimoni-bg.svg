<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Ornamental repeating tile: paisley + florals (subtle neutral colors) -->
  <defs>
    <style>
      .s { stroke: #cfcfd8; stroke-opacity: .45; stroke-width: 1.1; fill: none; }
      .sd { stroke: #dcdce3; stroke-opacity: .28; stroke-width: 0.9; fill: none; }
      .f { fill: #e7e7ee; fill-opacity: .35; }
    </style>
  </defs>
  <rect x="0" y="0" width="160" height="160" fill="transparent"/>
  <!-- center rosette -->
  <g>
    <circle class="sd" cx="80" cy="80" r="18"/>
    <circle class="sd" cx="80" cy="80" r="30" stroke-dasharray="4 7"/>
    <path class="s" d="M62 80a18 18 0 0 1 18-18"/>
    <path class="s" d="M98 80a18 18 0 0 1-18 18"/>
    <circle class="f" cx="80" cy="80" r="4"/>
  </g>
  <!-- paisley leaves around -->
  <g>
    <path class="s" d="M28 28c10-4 18 2 18 10 0 8-6 14-14 14-8 0-14-8-10-18 2-4 4-6 6-6z"/>
    <path class="sd" d="M120 26c8-3 14 3 14 10 0 8-6 14-14 14-8 0-12-8-10-16 2-4 6-6 10-8z"/>
    <path class="s" d="M24 126c10-6 20-4 24 6 2 6-2 12-8 14-10 4-20-4-18-14 2-4 4-6 2-6z"/>
    <path class="sd" d="M126 120c8-4 18-2 22 6 4 8-2 16-10 18-10 2-18-6-16-16 2-4 2-6 4-8z"/>
  </g>
  <!-- small accents -->
  <g>
    <circle class="f" cx="48" cy="20" r="3"/>
    <circle class="f" cx="20" cy="54" r="3"/>
    <circle class="f" cx="140" cy="44" r="3"/>
    <circle class="f" cx="118" cy="140" r="3"/>
    <circle class="f" cx="40" cy="120" r="3"/>
  </g>
</svg>
