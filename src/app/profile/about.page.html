<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/profile"></ion-back-button>
    </ion-buttons>
    <ion-title>About Us</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list inset>
    <ion-item>
      <ion-textarea autoGrow="true" [(ngModel)]="about"></ion-textarea>
    </ion-item>
  </ion-list>

  <div class="submit">
    <ion-button expand="block" (click)="submit()">Submit</ion-button>
  </div>
</ion-content>
